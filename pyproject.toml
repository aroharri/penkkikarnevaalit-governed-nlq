[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "penkkikarnevaalit-governed-nlq"
version = "0.1.0"
description = "Governed natural-language querying over a locked metric catalogue"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[tool.setuptools]
packages = ["nlq", "semantic"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests", "evals"]
